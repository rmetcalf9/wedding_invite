<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" preserveAspectRatio="none">
  <defs>
    <style>
      .rose{fill:none;stroke:#6b1f5c;stroke-width:5;opacity:.45}
      .leaf{fill:none;stroke:#6b1f5c;stroke-width:3;opacity:.35}
      .petal{fill:none;stroke:#6b1f5c;stroke-width:3;opacity:.25}
    </style>
  </defs>

  <!-- Top-left corner ornament -->
  <g transform="translate(35 35) scale(1.05) rotate(-6)">
    <path class="rose" d="M30,10 C20,25 20,40 30,50 C40,40 40,25 30,10Z"/>
    <path class="petal" d="M30,18 C24,26 25,35 30,42 C35,35 36,26 30,18Z"/>
    <path class="leaf" d="M8,46 C18,38 24,34 30,34"/>
    <path class="leaf" d="M52,46 C42,38 36,34 30,34"/>
  </g>

  <!-- Top-right corner ornament -->
  <g transform="translate(430 30) scale(0.98) rotate(8)">
    <path class="rose" d="M30,10 C20,25 20,40 30,50 C40,40 40,25 30,10Z"/>
    <path class="petal" d="M30,18 C24,26 25,35 30,42 C35,35 36,26 30,18Z"/>
    <path class="leaf" d="M8,46 C18,38 24,34 30,34"/>
    <path class="leaf" d="M52,46 C42,38 36,34 30,34"/>
  </g>

  <!-- Bottom-center rose -->
  <g transform="translate(210 210) scale(1.0)">
    <path class="rose" d="M30,10 C20,25 20,40 30,50 C40,40 40,25 30,10Z"/>
    <path class="petal" d="M30,18 C24,26 25,35 30,42 C35,35 36,26 30,18Z"/>
    <path class="leaf" d="M8,46 C18,38 24,34 30,34"/>
    <path class="leaf" d="M52,46 C42,38 36,34 30,34"/>
  </g>

  <!-- Subtle flourish line -->
  <path d="M95,155 C150,125 200,125 250,150 C300,175 350,180 405,160" fill="none" stroke="#6b1f5c" stroke-width="3" opacity=".18"/>
</svg>
